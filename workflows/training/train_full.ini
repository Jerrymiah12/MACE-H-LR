; Full-H baseline: the network predicts H_full directly, no LR split.
; Production-sized run on the frozen 404-snapshot 3x3x3 MgO main set.
; See README.md in this directory -- in particular, the workspace export state
; (training_target: full) must match this config before the graph cache is built.
;
; PATHS: set the two keys in [DEFAULT] below and nothing else moves.  They are
; interpolated into [basic] and [data] as %(training_root)s / %(workspace)s.
; `workflows/training/paths.py` resolves the same two values for the helper scripts from
; $MACEH_RUNS_ROOT and $MACEH_DATA_ROOT; keep them consistent, or pass
; --training-root / --workspace explicitly.  Relative paths resolve against the
; working directory, so run from the repo root or set absolute paths.
[DEFAULT]
training_root = ./runs
workspace = ./data

[basic]
device = cuda
dtype = float
inference = False
save_dir = %(training_root)s/run_full
additional_folder_name = full
simplified_output = True
seed = 42
checkpoint_dir =
use_new_hypp = False
; `high` enables TF32 tensor-core matmuls while retaining float32 outputs.
float32_matmul_precision = high

[data]
graph_dir =
; mgo_lr already exports DeepH-E3 format, so this is processed_data_dir --
; setting DFT_data_dir would shell out to process_data.py for an
; ABACUS -> DeepH conversion that has already happened.
DFT_data_dir =
; one dataset holding the frozen train+validation splits; the split
; itself is enforced below through extra_validation, NOT by ratio.
; Built by `python -m workflows.training.make_trainval_view`.
processed_data_dir = %(training_root)s/data_trainval
save_graph_dir = %(training_root)s/graphs_full
target_data = hamiltonian
dataset_name = mgo404full
get_overlap = False
radius = -1

[train]
num_epoch = 3000
batch_size = 2
; Keep the best model immediately, but cut routine restart-checkpoint writes
; about 10x by writing them every 10 completed epochs.
checkpoint_interval = 10
; Frozen-validation MSE in eV^2. 1e-6 is approximately 1 meV RMSE. Require a
; substantial warm-up and 10 consecutive hits so a noisy epoch cannot stop it.
early_stop_val_loss = 1e-6
early_stop_min_epochs = 200
early_stop_patience = 10
; The 37 frozen validation snapshot ids from splits.json ["main"]["validation"].
; `python -m workflows.training.check_split_wiring` asserts this list is exactly that set.
extra_validation = ['snapshot_000009', 'snapshot_000026', 'snapshot_000028', 'snapshot_000036', 'snapshot_000047', 'snapshot_000067', 'snapshot_000091', 'snapshot_000143', 'snapshot_000144', 'snapshot_000153', 'snapshot_000163', 'snapshot_000177', 'snapshot_000186', 'snapshot_000190', 'snapshot_000217', 'snapshot_000231', 'snapshot_000233', 'snapshot_000239', 'snapshot_000248', 'snapshot_000261', 'snapshot_000265', 'snapshot_000269', 'snapshot_000272', 'snapshot_000276', 'snapshot_000286', 'snapshot_000298', 'snapshot_000300', 'snapshot_000304', 'snapshot_000307', 'snapshot_000313', 'snapshot_000327', 'snapshot_000329', 'snapshot_000343', 'snapshot_000344', 'snapshot_000377', 'snapshot_000396', 'snapshot_000400']
extra_val_test_only = False
; extra_validation is removed from the pool first, so ratio 1.0 means
; 'train on exactly the 330 organize train snapshots'.
train_ratio = 1.0
val_ratio = 0
test_ratio = 0
train_size = -1
val_size = -1
test_size = -1
min_lr = 3e-5

[hyperparameters]
learning_rate = 0.002
Adam_betas = (0.9, 0.999)
scheduler_type = 1
scheduler_params = (factor=0.5, cooldown=40, patience=120, threshold=0.05, verbose=True)
revert_decay_patience = 20
revert_decay_rate = 0.8

[target]
target = hamiltonian
target_blocks_type = all
target_blocks =
selected_element_pairs =
convert_net_out = False

[network]
cutoff_radius = 7.2
only_ij = False
spherical_harmonics_lmax = 4
spherical_basis_irreps =
irreps_embed = 64x0e
irreps_mid = 64x0e+32x1o+16x2e+8x3o+8x4e
num_blocks = 3
ignore_parity = False
irreps_embed_node =
irreps_edge_init =
irreps_mid_node =
irreps_post_node =
irreps_out_node =
irreps_mid_edge =
irreps_post_edge =
out_irreps =
num_bessel = 16
num_polynomial_cutoff = 5
max_ell = 4
