; One-batch plumbing smoke. Deliberately tiny irreps and 1 epoch -- this checks
; that the real pipeline (AijData -> loader -> Net -> loss -> backward ->
; checkpoint) runs end to end on the target device, not that the model learns.
;
; It reads the 20-snapshot 2x2x2 *pilot* set, which is outside the main
; train/validation/test experiment entirely, so nothing here can touch the
; frozen splits. The model it builds is thrown away.
;
; Paths: see the [DEFAULT] note in train_sr.ini.
[DEFAULT]
training_root = ./runs
workspace = ./data

[basic]
device = cuda
dtype = float
inference = False
save_dir = %(training_root)s/smoke_onebatch
additional_folder_name = onebatch
simplified_output = True
seed = 42
checkpoint_dir =
use_new_hypp = False

[data]
graph_dir =
; mgo_lr already exports DeepH-E3 format, so this is processed_data_dir --
; setting DFT_data_dir would shell out to process_data.py for an
; ABACUS -> DeepH conversion that has already happened.
DFT_data_dir =
processed_data_dir = %(workspace)s/pilot
save_graph_dir = %(training_root)s/smoke_graphs
target_data = hamiltonian
dataset_name = mgosmokepilot
get_overlap = False
radius = -1

[train]
num_epoch = 1
batch_size = 1
extra_validation = []
extra_val_test_only = True
train_ratio = 0.67
val_ratio = 0.33
test_ratio = 0
train_size = -1
val_size = -1
test_size = -1
min_lr = 3e-5

[hyperparameters]
learning_rate = 0.002
Adam_betas = (0.9, 0.999)
scheduler_type = 1
scheduler_params = (factor=0.5, cooldown=40, patience=120, threshold=0.05, verbose=True)
revert_decay_patience = 20
revert_decay_rate = 0.8

[target]
target = hamiltonian
target_blocks_type = all
target_blocks =
selected_element_pairs =
convert_net_out = False

[network]
cutoff_radius = 7.2
only_ij = False
spherical_harmonics_lmax = 4
spherical_basis_irreps =
irreps_embed = 16x0e
irreps_mid = 16x0e+8x1o+4x2e+2x3o+2x4e
num_blocks = 1
ignore_parity = False
irreps_embed_node =
irreps_edge_init =
irreps_mid_node =
irreps_post_node =
irreps_out_node =
irreps_mid_edge =
irreps_post_edge =
out_irreps =
num_bessel = 16
num_polynomial_cutoff = 5
max_ell = 4
