; Stage-2 head-only warmup for the shared SR/Born/dielectric prototype.
; After this passes its gates, copy the file for partial fine-tuning, set
; freeze_backbone=False, freeze_h_head=False, unfreeze_last_interaction_blocks=1,
; backbone_learning_rate=1e-5, h_head_learning_rate=1e-5, and num_epoch=200.
[DEFAULT]
training_root = ./runs
workspace = ./data

[basic]
device = cuda
dtype = float
inference = False
save_dir = %(training_root)s/run_sr_tensors
additional_folder_name = sr_born_epsilon_head_warmup
simplified_output = True
seed = 42
checkpoint_dir = %(training_root)s/run_sr/2026-08-06_15-56-09_sr/best_model.pkl
use_new_hypp = True
float32_matmul_precision = high

[data]
graph_dir =
DFT_data_dir =
processed_data_dir = %(training_root)s/data_trainval
save_graph_dir = %(training_root)s/graphs_sr
target_data = hamiltonian
dataset_name = mgo404sr
get_overlap = False
radius = -1

[train]
num_epoch = 100
batch_size = 2
checkpoint_interval = 10
early_stop_val_loss = -1
early_stop_min_epochs = 0
early_stop_patience = 10
extra_validation = ['snapshot_000009', 'snapshot_000026', 'snapshot_000028', 'snapshot_000036', 'snapshot_000047', 'snapshot_000067', 'snapshot_000091', 'snapshot_000143', 'snapshot_000144', 'snapshot_000153', 'snapshot_000163', 'snapshot_000177', 'snapshot_000186', 'snapshot_000190', 'snapshot_000217', 'snapshot_000231', 'snapshot_000233', 'snapshot_000239', 'snapshot_000248', 'snapshot_000261', 'snapshot_000265', 'snapshot_000269', 'snapshot_000272', 'snapshot_000276', 'snapshot_000286', 'snapshot_000298', 'snapshot_000300', 'snapshot_000304', 'snapshot_000307', 'snapshot_000313', 'snapshot_000327', 'snapshot_000329', 'snapshot_000343', 'snapshot_000344', 'snapshot_000377', 'snapshot_000396', 'snapshot_000400']
extra_val_test_only = False
train_ratio = 1.0
val_ratio = 0
test_ratio = 0
train_size = -1
val_size = -1
test_size = -1
min_lr = 1e-6

[hyperparameters]
learning_rate = 0.001
Adam_betas = (0.9, 0.999)
scheduler_type = 1
scheduler_params = (factor=0.5, cooldown=10, patience=20, threshold=0.01, verbose=True)
revert_decay_patience = 20
revert_decay_rate = 0.8

[target]
target = hamiltonian
target_blocks_type = all
target_blocks =
selected_element_pairs =
convert_net_out = False

; These values are replaced from the initialization checkpoint's saved config.
[network]
cutoff_radius = 7.2
only_ij = False
spherical_harmonics_lmax = 4
spherical_basis_irreps =
irreps_embed = 64x0e
irreps_mid = 64x0e+32x1o+16x2e+8x3o+8x4e
num_blocks = 3
ignore_parity = False
irreps_embed_node =
irreps_edge_init =
irreps_mid_node =
irreps_post_node =
irreps_out_node =
irreps_mid_edge =
irreps_post_edge =
out_irreps =
num_bessel = 16
num_polynomial_cutoff = 5
max_ell = 4
hidden_irreps = 64x0e+64x1o+64x2e
avg_num_neighbors = 50
correlation = 3
radial_MLP = [64,64,64]
mace_norm = e3LayerNorm
expand_nonlin = True
expand_norm = e3LayerNorm
basis_func = Gaussian
num_gaussian = 128
shift_scale = True

[tensors]
predict_born = True
predict_epsilon = True
manifest = %(training_root)s/tensor_dfpt_54_fast/manifest_fast.json
train_ids = ['snapshot_000386', 'snapshot_000011', 'snapshot_000033', 'snapshot_000063', 'snapshot_000175', 'snapshot_000244', 'snapshot_000275', 'snapshot_000312', 'snapshot_000353', 'snapshot_000354']
validation_ids = ['snapshot_000028', 'snapshot_000327']
test_ids = ['snapshot_000080', 'snapshot_000229', 'snapshot_000295', 'snapshot_000333', 'snapshot_000334']
born_loss_weight = 1.0
epsilon_loss_weight = 1.0
backbone_learning_rate = 1e-5
h_head_learning_rate = 1e-5
head_learning_rate = 3e-4
freeze_backbone = True
freeze_h_head = True
unfreeze_last_interaction_blocks = 0
aux_gradient_max_norm = 1.0
labelled_structure_repeat = 4
checkpoint_mode = initialize
dielectric_eigenvalue_floor = 1e-4
h_validation_gate = 3e-6
born_validation_mae_gate = 0.002778
epsilon_validation_mae_gate = 0.001532
multitask_gate_patience = 10
